name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: inklucus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/inklucus
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/inklucus_test
      E2E_DATABASE_URL: postgresql://app:app@localhost:5432/inklucus_e2e
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create test databases
        run: |
          PGPASSWORD=app psql -h localhost -U app -d inklucus -c "CREATE DATABASE inklucus_test" -c "CREATE DATABASE inklucus_e2e"
          DATABASE_URL=$TEST_DATABASE_URL npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t inklucus:ci .
